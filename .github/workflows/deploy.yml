name: Deploy
on: [push] # 코드 수정 후 푸시하면 자동으로 시작됨

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. Docker Hub로 보내기
      - name: Push to Docker Hub
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-web:latest

      # 2. Azure ACR로 보내기
      - name: Push to ACR
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/my-web:latest

      # 3. Azure Container Apps에 자동 배포 명령
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Update Container App
        run: |
          az containerapp update -n [내앱이름] -g [리소스그룹명] --image ${{ secrets.ACR_LOGIN_SERVER }}/my-web:latest