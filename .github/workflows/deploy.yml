name: Multi-Registry Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. 소스 코드 체크아웃
    - name: Check out source code
      uses: actions/checkout@v4

    # 2. Docker 빌드 환경 설정
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Docker Hub 로그인
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    # 4. Azure ACR 로그인
    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v2
      with:
        login-server: ${{ secrets.AZURE_ACR_SERVER }}
        username: ${{ secrets.AZURE_ACR_USERNAME }}
        password: ${{ secrets.AZURE_ACR_PASSWORD }}

    # 5. Docker Hub와 Azure ACR에 동시 Push
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }}
          ${{ secrets.AZURE_ACR_SERVER }}/myapp:latest
          ${{ secrets.AZURE_ACR_SERVER }}/myapp:${{ github.sha }}